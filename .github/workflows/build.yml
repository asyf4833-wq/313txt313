name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Kivy Docker
        run: |
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            kivy/buildozer:latest \
            bash -c 'export SDKMANAGER=$(find / -name "sdkmanager" -type f 2>/dev/null | head -1); echo "Found: $SDKMANAGER"; if [ -n "$SDKMANAGER" ]; then yes | $SDKMANAGER --licenses || true; fi; buildozer android debug'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cyberapp-apk
          path: bin/*.apk
