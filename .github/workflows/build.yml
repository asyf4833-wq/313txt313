name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Accept licenses inside Kivy image
        run: |
          docker run --rm --entrypoint bash \
            -v "$PWD":/home/user/hostcwd \
            kivy/buildozer:latest \
            -c 'yes | sdkmanager --licenses || true'

      - name: Build APK
        run: |
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            kivy/buildozer:latest \
            android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cyberapp-apk
          path: bin/*.apk
